<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Proxy Browser</title>
  <link rel="icon" href="https://mmsgames.vercel.app/Logo125.png" type="image/png">

<style>
body {
  margin: 0;
  padding-top: 80px;
  background-color: #121212;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
.top-panel {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background-color: #1d1d1d;
  width: 100%;
  box-sizing: border-box;
  padding: 0px 20px;
  position: fixed;
  top: 0;
  left: 0;
  z-index: 1000;
  gap: 12px;
}
.right-side {
  display: flex;
  gap: 10px;
  align-items: center;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
}
.custom-button {
  flex: 0 0 auto;
  display: inline-block;
  background-color: #2c2c2c;
  color: #dfdfdf;
  border-radius: 15px;
  padding: 10px 20px;
  font-size: 16px;
  font-family: monospace;
  text-align: center;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
  transition: all 0.1s ease-in-out;
}
.right-side::-webkit-scrollbar {
  height: 8px;
}
.right-side::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.08);
  border-radius: 8px;
}
.tab-container {
  position: absolute;
  top: 60px;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  flex-direction: column;
  background: rgba(0,0,0,0);
  overflow: hidden;
}
.tab-header {
  display: flex;
  align-items: center;
  background: #2a2a2a;
  border-bottom: 1px solid #444;
}
.tab {
  padding: 12px 40px;
  cursor: pointer;
  position: relative;
  user-select: none;
  background: #252525;
  margin-right: 2px;
  transition: background 0.2s;
  box-shadow: 0 0 40px rgba(54, 54, 54, 0.6);
  color: white;
  display: flex;
  justify-content: flex-start;
  align-items: center;
  text-align: left;
  opacity: 1;
  transform: translateX(0);
}
.tab.active {
  background: rgb(39, 39, 39);
  font-weight: 400;
}
.tab:hover {
  background: #3d3d3d;
}
.tab .close-btn {
  position: absolute;
  bottom: 5px;
  right: 5px;
  font-size: 30px;
  cursor: pointer;
  color: #f1f1f1;
}
.tab .close-btn:hover {
  color: #fff;
}
.add-tab {
  background: #272727;
  padding: 12px 18px;
  cursor: pointer;
  font-weight: bold;
  font-size: 18px;
  transition: background 0.2s;
  color: white;
}
.add-tab:hover {
  background: #555;
}
.tab-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 20px;
  overflow: hidden;
  background: rgba(0,0,0,0);
}
#search-bar {
  display: flex;
  width: 100%;
  max-width: 500px;
  gap: 0;
}

#url-input {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 0;
  outline: none;
  font-size: 16px;
  background-color: #1e1e1e;
  color: #ccc;
}

#search-btn {
  width: 50px;
  height: 50px;
  background-color: #2a2a2a;
  border: none;
  border-radius: 0;
  font-size: 24px;
  cursor: pointer;
  color: white;
  transition: all 0.2s ease;
  flex: 0 0 auto;
}

#search-btn:hover {
  background-color: #333333;
}
#browser-frame {
  flex: 1;
  width: 100%;
  border: 1px solid #555;
  border-radius: 6px;
}
.background-circles {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: -1;
  overflow: hidden;
}
.circle {
  position: absolute;
  background: white;
  border-radius: 50%;
  opacity: 0.1;
  animation-name: moveDiagonal;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}
.top-panel img {
  height: 60px;
  width: 60px;
  border-radius: 0%;
  object-fit: cover;
}
.custom-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 2px #2e3c69;
}
.custom-button:active {
  transform: translateY(2px);
  box-shadow: 0 3px #2e3c69;
}
@keyframes moveDiagonal {
  0% { transform: translate(0, 0); opacity: 0.1; }
  100% { transform: translate(100vw, 100vh); opacity: 0; }
}
.tab-enter {
  opacity: 0;
  transform: translateX(-100%);
  transition: all 0.3s ease;
}
.tab-enter-active {
  opacity: 1;
  transform: translateX(0);
}
.tab-exit {
  opacity: 1;
  transform: translateX(0);
  transition: all 0.3s ease;
}
.tab-exit-active {
  opacity: 0;
  transform: translateX(100%);
}
</style>
</head>
<body>
  <script src="https://ubg48.vercel.app/class/uv.bundle.js" defer></script>
  <script src="https://ubg48.vercel.app/class/uv.config.js" defer></script>

<div class="background-circles"></div>
<div class="tab-container">
  <div class="tab-header">
    <div class="add-tab">+</div>    
  </div>
  <div class="tab-content" id="tabContent"></div>
</div>
<div class="top-panel">
    <img src="https://mmsgames.vercel.app/Logo125.png" alt="Sentry X Logo" />
    <div class="right-side">
        <div class="search-container" id="searchBox">
  <input type="text" class="search-input" id="searchInput" placeholder="Search for a game" />
  <button class="search-btn" id="searchBtn">
    <img src="/sentryx/thumbnails/search.png">
  </button>
</div>
        <div class="custom-button" onclick="window.location.href='/sentryx/home.html'">Home</div>
        <div class="custom-button" onclick="window.location.href='/sentryx/games.html'">Games</div>
        <div class="custom-button" onclick="window.location.href='/sentryx/apps.html'">Apps</div>
        <div class="custom-button" onclick="window.location.href='https://discord.gg/TKvhCRkajT'">Discord</div>
        <div class="custom-button" onclick="window.location.href='https://docs.google.com/document/d/1oW54dmtFARwzJp9Uu3OymB3GWxLT7_kjolLLpT-CXEM/edit?usp=sharing'">TOS</div>
  </div>
</div>
<script>
const tabHeader = document.querySelector('.tab-header');
const addTabButton = document.querySelector('.add-tab');
const tabContent = document.getElementById('tabContent');
let tabs = JSON.parse(localStorage.getItem('tabs')) || [];
let activeTabName = localStorage.getItem('activeTab') || null;
function saveTabs() {
  localStorage.setItem('tabs', JSON.stringify(tabs));
  localStorage.setItem('activeTab', activeTabName);
}
function renderTabs() {
  document.querySelectorAll('.tab').forEach(t => t.remove());
  tabs.forEach(tab => {
    const newTab = document.createElement('div');
    newTab.classList.add('tab', 'tab-enter');
    setTimeout(()=>newTab.classList.add('tab-enter-active'), 10);
    newTab.textContent = tab.name;
    const closeBtn = document.createElement('span');
    closeBtn.textContent = '×';
    closeBtn.classList.add('close-btn');
    newTab.appendChild(closeBtn);
    if(tab.name===activeTabName) newTab.classList.add('active');
    newTab.addEventListener('click', ()=>activateTab(tab.name));
    closeBtn.addEventListener('click', e=>{
      e.stopPropagation();
      newTab.classList.add('tab-exit');
      setTimeout(()=>{
        tabs=tabs.filter(t=>t.name!==tab.name);
        if(activeTabName===tab.name) activeTabName=tabs[0]?.name||null;
        saveTabs();
        renderTabs();
        renderContent();
      },300);
    });
    tabHeader.insertBefore(newTab, addTabButton);
  });
}
function renderContent() {
  tabContent.innerHTML='';
  if(!activeTabName) return;
  const currentTab = tabs.find(t=>t.name===activeTabName);
  if(!currentTab) return;
  const searchBar=document.createElement('div');
  searchBar.id='search-bar';
  const input=document.createElement('input');
  input.type='text';
  input.id='url-input';
  input.placeholder='Enter URL (e.g. example.com)';
  input.value=currentTab.url||'';
const button = document.createElement('button');
button.id = 'search-btn';
button.textContent = '';
button.style.backgroundImage = '/thumbnails/search.png)';
button.style.backgroundSize = 'cover';
button.style.backgroundPosition = 'center';
  const iframe=document.createElement('iframe');
  iframe.id='browser-frame';
  const encoded = __uv$config.encodeUrl(gameFile);
          const fullencodedLink = `https://ubg48.vercel.app/classes/math/${currentTab.url}`;
  iframe.src=currentTab.url?fullencodedLink:'';
  button.addEventListener('click',()=>{
    let url=input.value.trim();
    if(!url) return;
    if(!url.startsWith('http')) url='https://'+url;
    iframe.src=fullencodedLink;
    currentTab.url=url;
    saveTabs();
  });
  
  searchBar.appendChild(input);
  tabContent.appendChild(searchBar);
  searchBar.appendChild(button);
  tabContent.appendChild(iframe);
}
function activateTab(name){
  activeTabName=name;
  saveTabs();
  renderTabs();
  renderContent();
}
addTabButton.addEventListener('click',()=>{
  const newName=`Tab ${tabs.length+1}`;
  tabs.push({name:newName,url:''});
  activeTabName=newName;
  saveTabs();
  renderTabs();
  renderContent();
});
renderTabs();
renderContent();
</script>
<script>
const container=document.querySelector('.background-circles');
for(let i=0;i<125;i++){
  const circle=document.createElement('div');
  circle.className='circle';
  const top=Math.random()*100;
  const left=Math.random()*100;
  const size=10+Math.random()*15;
  const delay=-Math.random()*20;
  const duration=10+Math.random()*10;
  circle.style.top=`${top}%`;
  circle.style.left=`${left}%`;
  circle.style.width=`${size}px`;
  circle.style.height=`${size}px`;
  circle.style.animationDelay=`${delay}s`;
  circle.style.animationDuration=`${duration}s`;
  container.appendChild(circle);
}
</script>
</body>
</html>
