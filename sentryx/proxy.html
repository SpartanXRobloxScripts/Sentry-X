<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sentry X | Games</title>
  <link rel="icon" href="https://mmsgames.vercel.app/Logo125.png" type="image/png">
  <div id="codePopup" class="popup-overlay">
  <div class="popup-box">
    <h2>Enter Access Code</h2>
    <input type="text" id="firstnameInput" placeholder="First Name" />
    <input type="text" id="lastnameInput" placeholder="Last Name" />
    <input type="password" id="serialKeyInput" placeholder="Enter code..." />
    <button id="submitCode">Submit</button>
    <p id="codeMessage"></p>
  </div>
</div>
<style>

body {
  margin: 0;
  padding-top: 0px;
  background-color: #121212;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0px;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.top-panel {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background-color: #1d1d1d;
  width: 100%;
  box-sizing: border-box;
  padding: 0px 20px;
  position: fixed;
  top: 0;
  left: 0;
  z-index: 1000; /* stays above everything */
  gap: 12px;
}

/* Right side buttons (preserved) */
.right-side {
  display: flex;
  gap: 10px;
  align-items: center;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
}

.custom-button {
  flex: 0 0 auto;
  display: inline-block;
  background-color: #2c2c2c;
  color: #dfdfdf;
  border-radius: 15px;
  padding: 10px 20px;
  font-size: 16px;
  font-family: monospace;
  text-align: center;
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
  transition: all 0.1s ease-in-out;
}
.right-side::-webkit-scrollbar {
  height: 8px;
}
.right-side::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.08);
  border-radius: 8px;
}

.popup-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(10, 10, 10, 0.95);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 99999;
}
.popup-box {
  background: #1f1f1f;
  padding: 30px 40px;
  border-radius: 12px;
  text-align: center;
  box-shadow: 0 0 20px rgba(0,0,0,0.6);
  color: white;
  font-family: 'Segoe UI', sans-serif;
}
.popup-box h2 {
  margin-bottom: 15px;
}
.popup-box input {
  width: 100%;
  padding: 10px;
  font-size: 16px;
  border: none;
  outline: none;
  border-radius: 6px;
  background: #2c2c2c;
  color: white;
  margin-bottom: 10px;
}
.popup-box button {
  background: #2e3c69;
  border: none;
  color: white;
  padding: 10px 18px;
  font-size: 16px;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.2s;
}
.popup-box button:hover {
  background: #3d4d7d;
}
#codeMessage {
  margin-top: 10px;
  font-size: 14px;
  color: #ff6464;
}

.tab-container {
  position: relative;
  margin-top: 65px;
  width: 100vw;
  display: flex;
  flex-direction: column;
  gap: 0;
  padding: 0;
}


/* TAB HEADER */
.tab-header {
  display: flex;
  align-items: center;
  background: #2a2a2a;
}

/* TAB (uses flex; text on the left, close pushed to the right) */
.tab {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  height: auto;
  padding: 12px 14px;
  gap: 8px;
  background: #252525;
  margin-right: 2px;
  transition: background 0.2s;
  color: white;
  text-align: left;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 110px; /* keeps tabs usable */
  max-width: 320px;
  box-shadow: 0 0 14px rgba(0,0,0,0.25);
}

/* active / hover states */
.tab.active {
  background: rgb(39, 39, 39);
  font-weight: 400;
}
.tab:hover {
  background: #3d3d3d;
}

/* Close button aligned via flex instead of absolute positioning */
.tab .close-btn {
  position: static;
  margin-left: auto;
  font-size: 18px;
  cursor: pointer;
  color: #f1f1f1;
  padding-left: 8px;
  padding-right: 4px;
  line-height: 1;
  user-select: none;
}
.tab .close-btn:hover {
  color: #fff;
}

/* Add-tab button (unchanged) */
.add-tab {
  background: #272727;
  padding: 12px 18px;
  cursor: pointer;
  font-weight: bold;
  font-size: 18px;
  transition: background 0.2s;
  color: white;
}
.add-tab:hover {
  background: #555;
}

/* CONTENT AREA */
.tab-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 20px;
  overflow: hidden;
  background: rgba(0,0,0,0);
}

.search-bar {
  display: flex;
  gap: 0;
  margin: 0;
  padding: 0;
  background-color: #2a2a2a; /* keeps same background as tabs */
  width: 20%;
}

#url-input {
  flex: 1 1 auto;
  padding: 12px;
  margin: 0;
  border: none;
  outline: none;
  font-size: 16px;
  background-color: #1e1e1e;
  color: #ccc;
}

#search-btn {
  width: 50px;
  height: 50px;
  margin: 0;
  padding: 0;
  background-color: #1f1f1f;
  border: none;
  border-radius: 0;
  font-size: 24px;
  cursor: pointer;
  color: white;
  transition: all 0.2s ease;
}
#search-btn:hover {
  background-color: #333333;
}

#searchWrapper {
  margin: 0;
  padding: 0;
}

#browser-frame {
  width: calc(100vw - 10px);
  height: calc(100vh - 80px - 120px - 10px);
  margin: 5px;
  border: 1px solid #555;
  border-radius: 6px;
  display: block;
}

/* background circles (untouched) */
.background-circles {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: -1;
  overflow: hidden;
}
.circle {
  position: absolute;
  background: white;
  border-radius: 50%;
  opacity: 0.1;
  animation-name: moveDiagonal;
  animation-timing-function: linear;
  animation-iteration-count: infinite;
}

/* top-panel image */
.top-panel img {
  height: 60px;
  width: 60px;
  border-radius: 0%;
  object-fit: cover;
}

/* small button effects */
.custom-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 2px #2e3c69;
}
.custom-button:active {
  transform: translateY(2px);
  box-shadow: 0 3px #2e3c69;
}

/* diagonal animation */
@keyframes moveDiagonal {
  0% { transform: translate(0, 0); opacity: 0.1; }
  100% { transform: translate(100vw, 100vh); opacity: 0; }
}
</style>

</head>
<body>

<script src="https://ubg48.vercel.app/class/uv.bundle.js" defer></script>
<script src="https://ubg48.vercel.app/class/uv.config.js" defer></script>

<div class="tab-container">
  <div class="tab-header">
    <div class="add-tab">+</div>
  </div>

  <!-- SEARCH AREA BELOW TABS -->
  <div class="search-wrapper" id="searchWrapper"></div>

  <!-- MAIN PAGE AREA -->
  <div id="tabContent"></div>
</div>

<div class="top-panel">
  <img src="https://mmsgames.vercel.app/Logo125.png" />
  <div class="right-side">
    <div class="custom-button" onclick="window.location.href='/sentryx/home.html'">Home</div>
    <div class="custom-button" onclick="window.location.href='/sentryx/games.html'">Games</div>
    <div class="custom-button" onclick="window.location.href='/sentryx/apps.html'">Apps</div>
    <div class="custom-button" onclick="window.location.href='/sentryx/proxy.html'">Proxy</div>
    <div class="custom-button" onclick="window.location.href='https://discord.gg/TKvhCRkajT'">Discord</div>
    <div class="custom-button" onclick="window.location.href='https://docs.google.com/document/d/1oW54dmtFARwzJp9Uu3OymB3GWxLT7_kjolLLpT-CXEM/edit?usp=sharing'">TOS</div>
  </div>
</div>

<script>
const tabHeader = document.querySelector('.tab-header');
const addTabButton = document.querySelector('.add-tab');
const searchWrapper = document.getElementById('searchWrapper');
const tabContent = document.getElementById('tabContent');

let tabs = JSON.parse(localStorage.getItem('tabs')) || [];
let activeTabName = localStorage.getItem('activeTab') || null;

function saveTabs() {
  localStorage.setItem('tabs', JSON.stringify(tabs));
  localStorage.setItem('activeTab', activeTabName);
}

function renderTabs() {
  document.querySelectorAll('.tab').forEach(t => t.remove());

  tabs.forEach(tab => {
    const newTab = document.createElement('div');
    newTab.classList.add('tab');
    newTab.textContent = tab.name;

    const closeBtn = document.createElement('span');
    closeBtn.classList.add('close-btn');
    closeBtn.textContent = '×';
    newTab.appendChild(closeBtn);

    if (tab.name === activeTabName) newTab.classList.add('active');

    newTab.addEventListener('click', () => activateTab(tab.name));
    closeBtn.addEventListener('click', e => {
      e.stopPropagation();
      tabs = tabs.filter(t => t.name !== tab.name);

      if (activeTabName === tab.name)
        activeTabName = tabs[0]?.name || null;

      saveTabs();
      renderTabs();
      renderSearchBar();
    });

    tabHeader.insertBefore(newTab, addTabButton);
  });
}

function renderSearchBar() {
  searchWrapper.innerHTML = '';

  if (!activeTabName) return;

  const wrapper = document.createElement('div');
  wrapper.classList.add('search-bar');

  const input = document.createElement('input');
  input.id = 'url-input';
  input.placeholder = "Enter URL (e.g. example.com)";

  const currentTab = tabs.find(t => t.name === activeTabName);
  input.value = currentTab.url || '';

  const button = document.createElement('button');
  button.id = 'search-btn';
  
  const img = document.createElement('img');
  img.src = "/sentryx/thumbnails/search.png";
  img.style.width = '40px';
  img.style.height = '40px';
  img.style.objectFit = 'contain';
  img.align = "center";

  button.appendChild(img);

  wrapper.appendChild(input);
  wrapper.appendChild(button);
  searchWrapper.appendChild(wrapper);

  button.addEventListener('click', () => loadURL(input.value));
}

let abyssOpened = false;

function loadURL(url) {
  if (!url.trim()) return;

  if (!url.startsWith("http"))
    url = "https://" + url;

  const currentTab = tabs.find(t => t.name === activeTabName);
  currentTab.url = url;
  saveTabs();

  renderContent();
}

function renderContent() {
  tabContent.innerHTML = '';

  if (!activeTabName) return;
  const currentTab = tabs.find(t => t.name === activeTabName);

  const iframe = document.createElement('iframe');
  iframe.id = 'browser-frame';

  if (currentTab.url) {
    

    if (!abyssOpened){
      const abyssLink = window.open("https://ubg48.vercel.app","_blank");

      setTimeout(() => {
        abyssLink.close();
        abyssOpened=true;
      },3500)
    }

    const encoded = __uv$config.encodeUrl(currentTab.url);
    const fullencodedLink = `https://ubg48.vercel.app/classes/math/${encoded}`;

    window.open(fullencodedLink);
  }
  tabContent.appendChild(iframe);
}

function activateTab(name) {
  activeTabName = name;
  saveTabs();
  renderTabs();
  renderSearchBar();
}

addTabButton.addEventListener('click', () => {
  const newName = `Tab ${tabs.length + 1}`;
  tabs.push({ name: newName, url: '' });
  activeTabName = newName;

  saveTabs();
  renderTabs();
  renderSearchBar();
  renderContent();
});

renderTabs();
renderSearchBar();
renderContent();
</script>
<script>
const popup = document.getElementById("codePopup");
const message = document.getElementById("codeMessage");

async function checkCredentials(firstName, lastName, serialKey) {
    if (!firstName || !lastName || !serialKey) return false;
    message.textContent = "Checking credentials...";
    try {
        const response = await fetch(
            `https://noah.customcloudapp.net/api.php?f=validateMMSAccount&firstName=${encodeURIComponent(firstName)}&lastName=${encodeURIComponent(lastName)}&serialKey=${encodeURIComponent(serialKey)}`
        );
        const data = await response.json();
        if (data.accountValid === 1) {
            localStorage.setItem("firstName", firstName);
            localStorage.setItem("lastName", lastName);
            localStorage.setItem("serialKey", serialKey);
            return true;
        }
        return false;
    } catch {
        message.textContent = "Server error";
        return false;
    }
}

window.addEventListener("DOMContentLoaded", async () => {
    const firstName = localStorage.getItem("firstName");
    const lastName = localStorage.getItem("lastName");
    const serialKey = localStorage.getItem("serialKey");

    if (firstName && lastName && serialKey) {
        const isValid = await checkCredentials(firstName, lastName, serialKey);
        if (isValid) popup.style.display = "none";
    }
});

// Submit button
document.getElementById("submitCode").addEventListener("click", async () => {
    const first = document.getElementById("firstnameInput").value.trim();
    const last = document.getElementById("lastnameInput").value.trim();
    const key = document.getElementById("serialKeyInput").value.trim();

    const isValid = await checkCredentials(first, last, key);
    if (isValid) {
        popup.style.display = "none";
        message.textContent = "";
    } else {
        message.textContent = "Invalid credentials, please try again.";
    }
});

// Card click
document.querySelectorAll(".card").forEach(card => {
  card.addEventListener("click", async () => {
    const firstName = localStorage.getItem("firstName");
    const lastName = localStorage.getItem("lastName");
    const serialKey = localStorage.getItem("serialKey");
    const gameFile = card.getAttribute("data-game");
    const freelink = card.getAttribute("freelink");

    async function warmAbyssAndOpen(encodedUrl) {
      const tmp = window.open('https://ubg48.vercel.app/', '_blank');
        if (tmp){
          setTimeout(() => {
          tmp.close();
          window.location.href = encodedUrl;
          window.focus();
        },2500)
        }
        else{
          window.location.href = encodedUrl;
        }
    }

    if (firstName && lastName && serialKey) {
      const isValid = await checkCredentials(firstName, lastName, serialKey);
      if (isValid) {
        if (!freelink) {
          const encoded = __uv$config.encodeUrl(gameFile);
          const fullencodedLink = `https://ubg48.vercel.app/classes/math/${encoded}`;
          await warmAbyssAndOpen(fullencodedLink);
        } else {
          window.location.href = gameFile;
        }
      } else {
        popup.style.display = "flex";
      }
    } else {
      popup.style.display = "flex";
    }
  });
});


</script>

<script>
const box = document.getElementById("searchBox")
const input = document.getElementById("searchInput")
const btn = document.getElementById("searchBtn")
const cards = document.querySelectorAll(".card")

btn.onclick = () => {
  box.classList.add("active")
  input.focus()
}

input.onblur = () => {
  if (input.value === "") box.classList.remove("active")
}

input.oninput = () => {
  const value = input.value.toLowerCase()
  cards.forEach(card => {
    const title = card.querySelector(".title").textContent.toLowerCase()
    card.style.display = title.includes(value) ? "" : "none"
  })
}
</script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const wrapper = document.querySelector(".cards-wrapper");
  const cards = Array.from(wrapper.querySelectorAll(".card"));

  cards.sort((a, b) => {
    const titleA = a.querySelector(".title").textContent.trim().toLowerCase();
    const titleB = b.querySelector(".title").textContent.trim().toLowerCase();
    return titleA.localeCompare(titleB);
  });

  wrapper.innerHTML = "";
  cards.forEach(card => wrapper.appendChild(card));
});
</script>

<script>
window.addEventListener('load', () => {
  const overlay = document.getElementById('notificationOverlay');
  const confirmBtn = document.getElementById('notificationConfirm');

  // Show notification on first visit
  overlay.style.display = 'flex';

  confirmBtn.addEventListener('click', () => {
    overlay.style.display = 'none';
  });
});
</script>
</body>
</html>
